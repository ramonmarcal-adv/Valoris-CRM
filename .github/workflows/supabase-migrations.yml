name: Apply Supabase migrations

# Optional — inactive until you configure the two secrets below
# (Settings → Secrets and variables → Actions in this repo). Without
# them, the `supabase link` step fails visibly instead of silently
# skipping — see docs/DEPLOYMENT.md section 5.
#
# Only runs when a push to main actually touches supabase/migrations/,
# so unrelated app changes never trigger a migration attempt.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    name: supabase db push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
